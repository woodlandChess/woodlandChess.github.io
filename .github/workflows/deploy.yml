name: Deploy chess
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - name: Set base path
        id: base
        run: |
          REPO="${{ github.event.repository.name }}"
          if [[ "$REPO" == *.github.io ]]; then
            echo "path=/" >> "$GITHUB_OUTPUT"
          else
            echo "path=/$REPO/" >> "$GITHUB_OUTPUT"
          fi
      - run: npm run build
        env:
          VITE_BASE_PATH: ${{ steps.base.outputs.path }}
      - name: Enable direct mode URLs on GitHub Pages
        # Real files for every mode URL, so opening or reloading /ai, /puzzle, /multiplayer or /profile
        # answers 200 instead of the 404 fallback (which also logs a red error in the console).
        run: |
          cp dist/index.html dist/404.html
          for route in ai puzzle multiplayer profile; do
            mkdir -p "dist/$route"
            cp dist/index.html "dist/$route/index.html"
          done
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

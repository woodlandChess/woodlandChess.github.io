<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" width="1280" height="340" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090b"/>
      <stop offset="50%" stop-color="#0d1013"/>
      <stop offset="100%" stop-color="#08090b"/>
    </linearGradient>

    <!-- Radial glow top center -->
    <radialGradient id="glow" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#7c8891" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#08090b" stop-opacity="0"/>
    </radialGradient>

    <!-- Board square gradient light -->
    <linearGradient id="sqLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a2027"/>
      <stop offset="100%" stop-color="#141a20"/>
    </linearGradient>

    <!-- Board square gradient dark -->
    <linearGradient id="sqDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1013"/>
      <stop offset="100%" stop-color="#0a0d10"/>
    </linearGradient>

    <!-- Noise filter -->
    <filter id="noise" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="4" stitchTiles="stitch" result="noiseOut"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.53  0 0 0 0 0.56  0 0 0 0 0.58  0 0 0 0.04 0" result="coloredNoise"/>
      <feBlend in="SourceGraphic" in2="coloredNoise" mode="overlay"/>
    </filter>

    <!-- Glow filter for knight -->
    <filter id="knightGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur"/>
      <feColorMatrix in="blur" type="matrix"
        values="0 0 0 0 0.78   0 0 0 0 0.81   0 0 0 0 0.82   0 0 0 0.4 0" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Clip for board -->
    <clipPath id="boardClip">
      <rect x="0" y="0" width="1280" height="340"/>
    </clipPath>

    <!-- Fade mask left side of board -->
    <linearGradient id="boardFadeLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#08090b" stop-opacity="1"/>
      <stop offset="100%" stop-color="#08090b" stop-opacity="0"/>
    </linearGradient>
    <mask id="boardMaskLeft">
      <rect x="0" y="0" width="300" height="340" fill="url(#boardFadeLeft)"/>
      <rect x="300" y="0" width="980" height="340" fill="white"/>
    </mask>

    <!-- Fade mask right side of board -->
    <linearGradient id="boardFadeRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="white" stop-opacity="1"/>
      <stop offset="100%" stop-color="#08090b" stop-opacity="1"/>
    </linearGradient>
    <mask id="boardMaskRight">
      <rect x="0" y="0" width="980" height="340" fill="url(#boardFadeRight)"/>
      <rect x="980" y="0" width="300" height="340" fill="black"/>
    </mask>
  </defs>

  <!-- Base background -->
  <rect width="1280" height="340" fill="url(#bgGrad)"/>
  <rect width="1280" height="340" fill="url(#glow)"/>
  <rect width="1280" height="340" filter="url(#noise)" opacity="1"/>

  <!-- ═══ BOARD (right-anchored, fading in) ═══ -->
  <g mask="url(#boardMaskRight)" opacity="0.35" clip-path="url(#boardClip)">
    <!-- 8×8 grid, 42px squares, positioned right -->
    <g transform="translate(916, -2)">
      <!-- Row 0 -->
      <rect x="0"   y="0"   width="42" height="42" fill="url(#sqLight)"/>
      <rect x="42"  y="0"   width="42" height="42" fill="url(#sqDark)"/>
      <rect x="84"  y="0"   width="42" height="42" fill="url(#sqLight)"/>
      <rect x="126" y="0"   width="42" height="42" fill="url(#sqDark)"/>
      <rect x="168" y="0"   width="42" height="42" fill="url(#sqLight)"/>
      <rect x="210" y="0"   width="42" height="42" fill="url(#sqDark)"/>
      <rect x="252" y="0"   width="42" height="42" fill="url(#sqLight)"/>
      <rect x="294" y="0"   width="42" height="42" fill="url(#sqDark)"/>
      <!-- Row 1 -->
      <rect x="0"   y="42"  width="42" height="42" fill="url(#sqDark)"/>
      <rect x="42"  y="42"  width="42" height="42" fill="url(#sqLight)"/>
      <rect x="84"  y="42"  width="42" height="42" fill="url(#sqDark)"/>
      <rect x="126" y="42"  width="42" height="42" fill="url(#sqLight)"/>
      <rect x="168" y="42"  width="42" height="42" fill="url(#sqDark)"/>
      <rect x="210" y="42"  width="42" height="42" fill="url(#sqLight)"/>
      <rect x="252" y="42"  width="42" height="42" fill="url(#sqDark)"/>
      <rect x="294" y="42"  width="42" height="42" fill="url(#sqLight)"/>
      <!-- Row 2 -->
      <rect x="0"   y="84"  width="42" height="42" fill="url(#sqLight)"/>
      <rect x="42"  y="84"  width="42" height="42" fill="url(#sqDark)"/>
      <rect x="84"  y="84"  width="42" height="42" fill="url(#sqLight)"/>
      <rect x="126" y="84"  width="42" height="42" fill="url(#sqDark)"/>
      <rect x="168" y="84"  width="42" height="42" fill="url(#sqLight)"/>
      <rect x="210" y="84"  width="42" height="42" fill="url(#sqDark)"/>
      <rect x="252" y="84"  width="42" height="42" fill="url(#sqLight)"/>
      <rect x="294" y="84"  width="42" height="42" fill="url(#sqDark)"/>
      <!-- Row 3 -->
      <rect x="0"   y="126" width="42" height="42" fill="url(#sqDark)"/>
      <rect x="42"  y="126" width="42" height="42" fill="url(#sqLight)"/>
      <rect x="84"  y="126" width="42" height="42" fill="url(#sqDark)"/>
      <rect x="126" y="126" width="42" height="42" fill="url(#sqLight)"/>
      <rect x="168" y="126" width="42" height="42" fill="url(#sqDark)"/>
      <rect x="210" y="126" width="42" height="42" fill="url(#sqLight)"/>
      <rect x="252" y="126" width="42" height="42" fill="url(#sqDark)"/>
      <rect x="294" y="126" width="42" height="42" fill="url(#sqLight)"/>
      <!-- Row 4 -->
      <rect x="0"   y="168" width="42" height="42" fill="url(#sqLight)"/>
      <rect x="42"  y="168" width="42" height="42" fill="url(#sqDark)"/>
      <rect x="84"  y="168" width="42" height="42" fill="url(#sqLight)"/>
      <rect x="126" y="168" width="42" height="42" fill="url(#sqDark)"/>
      <rect x="168" y="168" width="42" height="42" fill="url(#sqLight)"/>
      <rect x="210" y="168" width="42" height="42" fill="url(#sqDark)"/>
      <rect x="252" y="168" width="42" height="42" fill="url(#sqLight)"/>
      <rect x="294" y="168" width="42" height="42" fill="url(#sqDark)"/>
      <!-- Row 5 -->
      <rect x="0"   y="210" width="42" height="42" fill="url(#sqDark)"/>
      <rect x="42"  y="210" width="42" height="42" fill="url(#sqLight)"/>
      <rect x="84"  y="210" width="42" height="42" fill="url(#sqDark)"/>
      <rect x="126" y="210" width="42" height="42" fill="url(#sqLight)"/>
      <rect x="168" y="210" width="42" height="42" fill="url(#sqDark)"/>
      <rect x="210" y="210" width="42" height="42" fill="url(#sqLight)"/>
      <rect x="252" y="210" width="42" height="42" fill="url(#sqDark)"/>
      <rect x="294" y="210" width="42" height="42" fill="url(#sqLight)"/>
      <!-- Row 6 -->
      <rect x="0"   y="252" width="42" height="42" fill="url(#sqLight)"/>
      <rect x="42"  y="252" width="42" height="42" fill="url(#sqDark)"/>
      <rect x="84"  y="252" width="42" height="42" fill="url(#sqLight)"/>
      <rect x="126" y="252" width="42" height="42" fill="url(#sqDark)"/>
      <rect x="168" y="252" width="42" height="42" fill="url(#sqLight)"/>
      <rect x="210" y="252" width="42" height="42" fill="url(#sqDark)"/>
      <rect x="252" y="252" width="42" height="42" fill="url(#sqLight)"/>
      <rect x="294" y="252" width="42" height="42" fill="url(#sqDark)"/>
      <!-- Row 7 -->
      <rect x="0"   y="294" width="42" height="42" fill="url(#sqDark)"/>
      <rect x="42"  y="294" width="42" height="42" fill="url(#sqLight)"/>
      <rect x="84"  y="294" width="42" height="42" fill="url(#sqDark)"/>
      <rect x="126" y="294" width="42" height="42" fill="url(#sqLight)"/>
      <rect x="168" y="294" width="42" height="42" fill="url(#sqDark)"/>
      <rect x="210" y="294" width="42" height="42" fill="url(#sqLight)"/>
      <rect x="252" y="294" width="42" height="42" fill="url(#sqDark)"/>
      <rect x="294" y="294" width="42" height="42" fill="url(#sqLight)"/>
    </g>
    <!-- Board border -->
    <rect x="914" y="-2" width="338" height="338" fill="none" stroke="rgba(214,219,222,0.06)" stroke-width="1"/>
  </g>

  <!-- Subtle horizontal rule -->
  <line x1="80" y1="270" x2="580" y2="270" stroke="rgba(214,219,222,0.06)" stroke-width="1"/>

  <!-- ═══ BRAND MARK ═══ -->
  <!-- Icon container -->
  <rect x="80" y="54" width="52" height="52" rx="6" fill="#0d1013" stroke="rgba(214,219,222,0.10)" stroke-width="1"/>
  <!-- Knight glyph -->
  <text x="106" y="95" font-family="Georgia, 'Cormorant Garamond', serif" font-size="38" text-anchor="middle"
        fill="#c9cfd2" filter="url(#knightGlow)">♞</text>

  <!-- ═══ EYEBROW ═══ -->
  <text x="80" y="144"
        font-family="'Courier New', monospace" font-size="9" letter-spacing="5"
        fill="#7f8589" text-anchor="start">WOODLAND CHESS</text>

  <!-- ═══ HEADLINE ═══ -->
  <text x="80" y="200"
        font-family="Georgia, 'Cormorant Garamond', serif" font-style="italic" font-weight="300"
        font-size="68" letter-spacing="-1.5"
        fill="#e6e3da" text-anchor="start">Play with intent.</text>

  <!-- ═══ SUB ═══ -->
  <text x="80" y="238"
        font-family="system-ui, sans-serif" font-weight="300" font-size="15" letter-spacing="0.2"
        fill="#9aa3a8" text-anchor="start">React · TypeScript · Stockfish 18 · Mobile-first</text>

  <!-- Bottom divider line -->
  <line x1="0" y1="339" x2="1280" y2="339" stroke="rgba(214,219,222,0.07)" stroke-width="1"/>
</svg>

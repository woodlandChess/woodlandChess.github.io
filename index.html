<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- Mobile-first viewport: locks pinch-zoom, respects notches (viewport-fit=cover) -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Woodland Chess</title>
  <meta name="description" content="Play chess against Stockfish, meet real opponents on Lichess, solve rated puzzles and review your own games. One dark, mobile-first board." />

  <!-- Theming for mobile browser chrome / status bar -->
  <meta name="theme-color" content="#08090b" />
  <meta name="color-scheme" content="dark" />

  <!-- iOS: allow standalone "add to home screen" web-app behaviour -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Woodland Chess" />
  <meta name="format-detection" content="telephone=no" />

  <!-- Fonts: connect early, load without blocking first paint (swap shows a system serif/sans until ready) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=Jost:wght@300;400;500&family=JetBrains+Mono:wght@400&display=swap" media="print" onload="this.media='all'" />
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=Jost:wght@300;400;500&family=JetBrains+Mono:wght@400&display=swap" /></noscript>

  <link rel="manifest" href="/manifest.webmanifest?v=2" />
  <link rel="icon" href="/icons/trident.svg" type="image/svg+xml" />
  <link rel="icon" href="/icons/trident-192.png" type="image/png" sizes="192x192" />
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/trident-touch-180.png" />
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>

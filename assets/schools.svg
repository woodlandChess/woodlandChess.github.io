<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="900" height="240" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="glowSoft">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="240" fill="#08090b"/>
  <filter id="nt3">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.53  0 0 0 0 0.56  0 0 0 0 0.58  0 0 0 0.04 0"/>
  </filter>
  <rect width="900" height="240" filter="url(#nt3)" opacity="1"/>

  <!-- Title -->
  <text x="450" y="30" font-family="Georgia, serif" font-style="italic" font-size="14"
        fill="#9aa3a8" text-anchor="middle" letter-spacing="0.5">Playing Schools — Opening Repertoires</text>
  <line x1="60" y1="40" x2="840" y2="40" stroke="rgba(214,219,222,0.06)" stroke-width="1"/>

  <!-- Cards — 5 per row, 2 rows -->
  <!-- Row 1 -->
  <!-- Universal -->
  <rect x="60"  y="54" width="144" height="78" rx="2" fill="#0d1013" stroke="rgba(201,207,210,0.08)" stroke-width="1"/>
  <text x="132" y="73"  font-family="Georgia, serif" font-style="italic" font-size="13" fill="#e6e3da" text-anchor="middle">Universal</text>
  <line x1="76"  y1="78" x2="188" y2="78" stroke="rgba(214,219,222,0.06)" stroke-width="1"/>
  <text x="132" y="93"  font-family="system-ui, sans-serif" font-size="9" fill="#9aa3a8" text-anchor="middle">No fixed bias</text>
  <text x="132" y="108" font-family="system-ui, sans-serif" font-size="9" fill="#9aa3a8" text-anchor="middle">Adapts to position</text>
  <text x="132" y="123" font-family="'Courier New', monospace" font-size="8" fill="#7f8589" text-anchor="middle">♘ — any opening</text>

  <!-- Soviet / Russian -->
  <rect x="216" y="54" width="144" height="78" rx="2" fill="#0d1013" stroke="rgba(201,207,210,0.08)" stroke-width="1"/>
  <text x="288" y="73"  font-family="Georgia, serif" font-style="italic" font-size="13" fill="#e6e3da" text-anchor="middle">Russian</text>
  <line x1="232" y1="78" x2="344" y2="78" stroke="rgba(214,219,222,0.06)" stroke-width="1"/>
  <text x="288" y="93"  font-family="system-ui, sans-serif" font-size="9" fill="#9aa3a8" text-anchor="middle">Sound development</text>
  <text x="288" y="108" font-family="system-ui, sans-serif" font-size="9" fill="#9aa3a8" text-anchor="middle">Balanced play</text>
  <text x="288" y="123" font-family="'Courier New', monospace" font-size="8" fill="#7f8589" text-anchor="middle">d4 d5 · c4 e6 · Nf3</text>

  <!-- British -->
  <rect x="372" y="54" width="144" height="78" rx="2" fill="#0d1013" stroke="rgba(201,207,210,0.08)" stroke-width="1"/>
  <text x="444" y="73"  font-family="Georgia, serif" font-style="italic" font-size="13" fill="#e6e3da" text-anchor="middle">British</text>
  <line x1="388" y1="78" x2="500" y2="78" stroke="rgba(214,219,222,0.06)" stroke-width="1"/>
  <text x="444" y="93"  font-family="system-ui, sans-serif" font-size="9" fill="#9aa3a8" text-anchor="middle">Practical, flexible</text>
  <text x="444" y="108" font-family="system-ui, sans-serif" font-size="9" fill="#9aa3a8" text-anchor="middle">Sound endgame</text>
  <text x="444" y="123" font-family="'Courier New', monospace" font-size="8" fill="#7f8589" text-anchor="middle">Nf3 Nf6 · c4 e5</text>

  <!-- Classical German -->
  <rect x="528" y="54" width="144" height="78" rx="2" fill="#0d1013" stroke="rgba(201,207,210,0.08)" stroke-width="1"/>
  <text x="600" y="73"  font-family="Georgia, serif" font-style="italic" font-size="13" fill="#e6e3da" text-anchor="middle">German</text>
  <line x1="544" y1="78" x2="656" y2="78" stroke="rgba(214,219,222,0.06)" stroke-width="1"/>
  <text x="600" y="93"  font-family="system-ui, sans-serif" font-size="9" fill="#9aa3a8" text-anchor="middle">Central control</text>
  <text x="600" y="108" font-family="system-ui, sans-serif" font-size="9" fill="#9aa3a8" text-anchor="middle">Fast development</text>
  <text x="600" y="123" font-family="'Courier New', monospace" font-size="8" fill="#7f8589" text-anchor="middle">e4 e5 · Nf3 Nc6 · Bc4</text>

  <!-- Hungarian -->
  <rect x="684" y="54" width="156" height="78" rx="2" fill="#0d1013" stroke="rgba(201,207,210,0.08)" stroke-width="1"/>
  <text x="762" y="73"  font-family="Georgia, serif" font-style="italic" font-size="13" fill="#e6e3da" text-anchor="middle">Hungarian</text>
  <line x1="700" y1="78" x2="824" y2="78" stroke="rgba(214,219,222,0.06)" stroke-width="1"/>
  <text x="762" y="93"  font-family="system-ui, sans-serif" font-size="9" fill="#9aa3a8" text-anchor="middle">Solid structures</text>
  <text x="762" y="108" font-family="system-ui, sans-serif" font-size="9" fill="#9aa3a8" text-anchor="middle">Technical defence</text>
  <text x="762" y="123" font-family="'Courier New', monospace" font-size="8" fill="#7f8589" text-anchor="middle">d4 d5 · c4 c6</text>

  <!-- Row 2 -->
  <!-- American -->
  <rect x="60"  y="148" width="144" height="78" rx="2" fill="#0d1013" stroke="rgba(201,207,210,0.08)" stroke-width="1"/>
  <text x="132" y="167" font-family="Georgia, serif" font-style="italic" font-size="13" fill="#e6e3da" text-anchor="middle">American</text>
  <line x1="76"  y1="172" x2="188" y2="172" stroke="rgba(214,219,222,0.06)" stroke-width="1"/>
  <text x="132" y="187" font-family="system-ui, sans-serif" font-size="9" fill="#9aa3a8" text-anchor="middle">Calculation</text>
  <text x="132" y="202" font-family="system-ui, sans-serif" font-size="9" fill="#9aa3a8" text-anchor="middle">Precise conversion</text>
  <text x="132" y="217" font-family="'Courier New', monospace" font-size="8" fill="#7f8589" text-anchor="middle">e4 c5 · Nf3 d6 · d4</text>

  <!-- Attacking -->
  <rect x="216" y="148" width="144" height="78" rx="2" fill="#0d1013" stroke="rgba(124,136,145,0.15)" stroke-width="1"/>
  <!-- highlight accent -->
  <rect x="216" y="148" width="144" height="2" rx="0" fill="rgba(124,136,145,0.35)"/>
  <text x="288" y="167" font-family="Georgia, serif" font-style="italic" font-size="13" fill="#e6e3da" text-anchor="middle">Attacking</text>
  <line x1="232" y1="172" x2="344" y2="172" stroke="rgba(214,219,222,0.06)" stroke-width="1"/>
  <text x="288" y="187" font-family="system-ui, sans-serif" font-size="9" fill="#9aa3a8" text-anchor="middle">Initiative + open lines</text>
  <text x="288" y="202" font-family="system-ui, sans-serif" font-size="9" fill="#9aa3a8" text-anchor="middle">King-side pressure</text>
  <text x="288" y="217" font-family="'Courier New', monospace" font-size="8" fill="#7f8589" text-anchor="middle">e4 e5 · f4 (King's Gambit)</text>

  <!-- Defensive -->
  <rect x="372" y="148" width="144" height="78" rx="2" fill="#0d1013" stroke="rgba(201,207,210,0.08)" stroke-width="1"/>
  <text x="444" y="167" font-family="Georgia, serif" font-style="italic" font-size="13" fill="#e6e3da" text-anchor="middle">Defensive</text>
  <line x1="388" y1="172" x2="500" y2="172" stroke="rgba(214,219,222,0.06)" stroke-width="1"/>
  <text x="444" y="187" font-family="system-ui, sans-serif" font-size="9" fill="#9aa3a8" text-anchor="middle">Threat prevention</text>
  <text x="444" y="202" font-family="system-ui, sans-serif" font-size="9" fill="#9aa3a8" text-anchor="middle">Timed counterattack</text>
  <text x="444" y="217" font-family="'Courier New', monospace" font-size="8" fill="#7f8589" text-anchor="middle">d4 Nf6 · c4 e6</text>

  <!-- Positional -->
  <rect x="528" y="148" width="144" height="78" rx="2" fill="#0d1013" stroke="rgba(201,207,210,0.08)" stroke-width="1"/>
  <text x="600" y="167" font-family="Georgia, serif" font-style="italic" font-size="13" fill="#e6e3da" text-anchor="middle">Positional</text>
  <line x1="544" y1="172" x2="656" y2="172" stroke="rgba(214,219,222,0.06)" stroke-width="1"/>
  <text x="600" y="187" font-family="system-ui, sans-serif" font-size="9" fill="#9aa3a8" text-anchor="middle">Pawn structure</text>
  <text x="600" y="202" font-family="system-ui, sans-serif" font-size="9" fill="#9aa3a8" text-anchor="middle">Gradual improvement</text>
  <text x="600" y="217" font-family="'Courier New', monospace" font-size="8" fill="#7f8589" text-anchor="middle">d4 d5 · c4 e6 · Nc3</text>

  <!-- Dynamic -->
  <rect x="684" y="148" width="156" height="78" rx="2" fill="#0d1013" stroke="rgba(201,207,210,0.08)" stroke-width="1"/>
  <text x="762" y="167" font-family="Georgia, serif" font-style="italic" font-size="13" fill="#e6e3da" text-anchor="middle">Dynamic</text>
  <line x1="700" y1="172" x2="824" y2="172" stroke="rgba(214,219,222,0.06)" stroke-width="1"/>
  <text x="762" y="187" font-family="system-ui, sans-serif" font-size="9" fill="#9aa3a8" text-anchor="middle">Active pieces</text>
  <text x="762" y="202" font-family="system-ui, sans-serif" font-size="9" fill="#9aa3a8" text-anchor="middle">Persistent pressure</text>
  <text x="762" y="217" font-family="'Courier New', monospace" font-size="8" fill="#7f8589" text-anchor="middle">e4 c5 (Sicilian)</text>

  <!-- Border -->
  <rect x="0.5" y="0.5" width="899" height="239" rx="2" fill="none"
        stroke="rgba(214,219,222,0.07)" stroke-width="1"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d1013"/>
      <stop offset="100%" stop-color="#08090b"/>
    </linearGradient>
    <filter id="cardShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="8" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="rgba(124,136,145,0.6)"/>
    </marker>
    <marker id="arrowBright" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="rgba(201,207,210,0.5)"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="420" fill="url(#bg)"/>

  <!-- Noise texture -->
  <filter id="n2">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.53  0 0 0 0 0.56  0 0 0 0 0.58  0 0 0 0.04 0"/>
  </filter>
  <rect width="900" height="420" filter="url(#n2)" opacity="1"/>

  <!-- Title -->
  <text x="450" y="36" font-family="Georgia, serif" font-style="italic" font-size="15"
        fill="#9aa3a8" text-anchor="middle" letter-spacing="0.5">Architecture Overview</text>
  <line x1="60" y1="46" x2="840" y2="46" stroke="rgba(214,219,222,0.06)" stroke-width="1"/>

  <!-- ─── LAYER LABELS ─── -->
  <text x="32" y="148" font-family="'Courier New', monospace" font-size="8" fill="#7f8589"
        letter-spacing="3" transform="rotate(-90, 32, 148)">PRESENTATION</text>
  <text x="32" y="268" font-family="'Courier New', monospace" font-size="8" fill="#7f8589"
        letter-spacing="3" transform="rotate(-90, 32, 268)">LOGIC</text>
  <text x="32" y="368" font-family="'Courier New', monospace" font-size="8" fill="#7f8589"
        letter-spacing="3" transform="rotate(-90, 32, 368)">ENGINE</text>

  <!-- ─── LAYER DIVIDERS ─── -->
  <line x1="60" y1="200" x2="840" y2="200" stroke="rgba(214,219,222,0.05)" stroke-width="1" stroke-dasharray="4,6"/>
  <line x1="60" y1="310" x2="840" y2="310" stroke="rgba(214,219,222,0.05)" stroke-width="1" stroke-dasharray="4,6"/>

  <!-- ════ LAYER 1: PRESENTATION ════ -->

  <!-- App.tsx -->
  <g filter="url(#cardShadow)">
    <rect x="330" y="64" width="240" height="118" rx="2" fill="#12161a" stroke="rgba(201,207,210,0.12)" stroke-width="1"/>
  </g>
  <text x="450" y="85" font-family="'Courier New', monospace" font-size="9" fill="#7f8589"
        text-anchor="middle" letter-spacing="2">COMPONENT</text>
  <text x="450" y="103" font-family="Georgia, serif" font-style="italic" font-size="16"
        fill="#e6e3da" text-anchor="middle">App.tsx</text>
  <line x1="350" y1="110" x2="550" y2="110" stroke="rgba(214,219,222,0.07)" stroke-width="1"/>
  <text x="360" y="126" font-family="system-ui, sans-serif" font-size="10" fill="#9aa3a8">♟ Board grid (8×8)</text>
  <text x="360" y="142" font-family="system-ui, sans-serif" font-size="10" fill="#9aa3a8">♔ Setup screen</text>
  <text x="360" y="158" font-family="system-ui, sans-serif" font-size="10" fill="#9aa3a8">♛ Promotion modal</text>

  <!-- styles.css -->
  <g filter="url(#cardShadow)">
    <rect x="88" y="72" width="190" height="100" rx="2" fill="#12161a" stroke="rgba(201,207,210,0.08)" stroke-width="1"/>
  </g>
  <text x="183" y="91" font-family="'Courier New', monospace" font-size="9" fill="#7f8589"
        text-anchor="middle" letter-spacing="2">DESIGN</text>
  <text x="183" y="108" font-family="Georgia, serif" font-style="italic" font-size="14"

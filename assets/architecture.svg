  <text x="360" y="270" font-family="system-ui, sans-serif" font-size="10" fill="#9aa3a8">α-β minimax search</text>
  <text x="360" y="285" font-family="system-ui, sans-serif" font-size="10" fill="#9aa3a8">Material + positional eval</text>

  <!-- stockfish.ts -->
  <g filter="url(#cardShadow)">
    <rect x="622" y="216" width="190" height="80" rx="2" fill="#0f1316" stroke="rgba(201,207,210,0.08)" stroke-width="1"/>
  </g>
  <text x="717" y="235" font-family="'Courier New', monospace" font-size="9" fill="#7f8589"
        text-anchor="middle" letter-spacing="2">CLIENT</text>
  <text x="717" y="252" font-family="Georgia, serif" font-style="italic" font-size="14"
        fill="#c9cfd2" text-anchor="middle">stockfish.ts</text>
  <text x="652" y="270" font-family="system-ui, sans-serif" font-size="10" fill="#9aa3a8">UCI protocol</text>
  <text x="652" y="285" font-family="system-ui, sans-serif" font-size="10" fill="#9aa3a8">School opening book</text>

  <!-- Arrows L2 -->
  <line x1="450" y1="182" x2="450" y2="214" stroke="rgba(124,136,145,0.45)" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="278" y1="256" x2="328" y2="256" stroke="rgba(124,136,145,0.45)" stroke-width="1"
        stroke-dasharray="3,4" marker-end="url(#arrow)"/>
  <line x1="572" y1="256" x2="620" y2="256" stroke="rgba(124,136,145,0.45)" stroke-width="1"
        stroke-dasharray="3,4" marker-end="url(#arrow)"/>

  <!-- ════ LAYER 3: ENGINE ════ -->

  <!-- Stockfish WASM -->
  <g filter="url(#cardShadow)">
    <rect x="270" y="326" width="360" height="70" rx="2" fill="#0a0d10" stroke="rgba(201,207,210,0.12)" stroke-width="1"/>
  </g>
  <!-- accent bar -->
  <rect x="270" y="326" width="360" height="2" rx="1" fill="rgba(124,136,145,0.4)"/>
  <text x="450" y="345" font-family="'Courier New', monospace" font-size="9" fill="#7f8589"
        text-anchor="middle" letter-spacing="2">WEB WORKER</text>
  <text x="450" y="363" font-family="Georgia, serif" font-style="italic" font-size="15"
        fill="#e6e3da" text-anchor="middle">Stockfish 18 Lite · WASM</text>
  <text x="450" y="382" font-family="system-ui, sans-serif" font-size="10" fill="#9aa3a8"
        text-anchor="middle">stockfish-18-lite-single.wasm · GPLv3</text>

  <!-- Arrow L3 -->
  <line x1="717" y1="296" x2="630" y2="324" stroke="rgba(124,136,145,0.45)" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="450" y1="296" x2="450" y2="324" stroke="rgba(124,136,145,0.45)" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Border -->
  <rect x="0.5" y="0.5" width="899" height="419" rx="2" fill="none"
        stroke="rgba(214,219,222,0.07)" stroke-width="1"/>
</svg>

  <line x1="108" y1="115" x2="263" y2="115" stroke="rgba(214,219,222,0.07)" stroke-width="1"/>
  <text x="118" y="131" font-family="system-ui, sans-serif" font-size="10" fill="#9aa3a8">Cormorant Garamond</text>
  <text x="118" y="147" font-family="system-ui, sans-serif" font-size="10" fill="#9aa3a8">Jost · JetBrains Mono</text>
  <text x="118" y="163" font-family="system-ui, sans-serif" font-size="10" fill="#9aa3a8">CSS custom properties</text>

  <!-- Dropdown component -->
  <g filter="url(#cardShadow)">
    <rect x="622" y="72" width="190" height="100" rx="2" fill="#12161a" stroke="rgba(201,207,210,0.08)" stroke-width="1"/>
  </g>
  <text x="717" y="91" font-family="'Courier New', monospace" font-size="9" fill="#7f8589"
        text-anchor="middle" letter-spacing="2">COMPONENT</text>
  <text x="717" y="108" font-family="Georgia, serif" font-style="italic" font-size="14"
        fill="#c9cfd2" text-anchor="middle">Dropdown</text>
  <line x1="642" y1="115" x2="797" y2="115" stroke="rgba(214,219,222,0.07)" stroke-width="1"/>
  <text x="652" y="131" font-family="system-ui, sans-serif" font-size="10" fill="#9aa3a8">Custom ARIA listbox</text>
  <text x="652" y="147" font-family="system-ui, sans-serif" font-size="10" fill="#9aa3a8">Mobile sheet panel</text>
  <text x="652" y="163" font-family="system-ui, sans-serif" font-size="10" fill="#9aa3a8">Keyboard + pointer</text>

  <!-- Arrows L1 -->
  <line x1="278" y1="122" x2="328" y2="122" stroke="rgba(124,136,145,0.45)" stroke-width="1"
        stroke-dasharray="3,4" marker-end="url(#arrow)"/>
  <line x1="572" y1="122" x2="620" y2="122" stroke="rgba(124,136,145,0.45)" stroke-width="1"
        stroke-dasharray="3,4" marker-end="url(#arrow)"/>

  <!-- ════ LAYER 2: LOGIC ════ -->

  <!-- chess.js state -->
  <g filter="url(#cardShadow)">
    <rect x="88" y="216" width="190" height="80" rx="2" fill="#0f1316" stroke="rgba(201,207,210,0.08)" stroke-width="1"/>
  </g>
  <text x="183" y="235" font-family="'Courier New', monospace" font-size="9" fill="#7f8589"
        text-anchor="middle" letter-spacing="2">LIBRARY</text>
  <text x="183" y="252" font-family="Georgia, serif" font-style="italic" font-size="14"

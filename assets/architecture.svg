  <text x="118" y="270" font-family="system-ui, sans-serif" font-size="10" fill="#9aa3a8">Move validation</text>
  <text x="118" y="285" font-family="system-ui, sans-serif" font-size="10" fill="#9aa3a8">FEN · PGN · SAN</text>


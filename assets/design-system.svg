<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360">
  <defs>
    <filter id="cardSh">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="360" fill="#08090b"/>
  <filter id="nt">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.53  0 0 0 0 0.56  0 0 0 0 0.58  0 0 0 0.04 0"/>
  </filter>
  <rect width="900" height="360" filter="url(#nt)" opacity="1"/>

  <!-- Title -->
  <text x="450" y="34" font-family="Georgia, serif" font-style="italic" font-size="15"
        fill="#9aa3a8" text-anchor="middle" letter-spacing="0.5">Design System · Token Reference</text>
  <line x1="60" y1="44" x2="840" y2="44" stroke="rgba(214,219,222,0.06)" stroke-width="1"/>

  <!-- ─── COLOUR PALETTE ─── -->
  <text x="80" y="68" font-family="'Courier New', monospace" font-size="8" fill="#7f8589" letter-spacing="3">COLOUR PALETTE</text>

  <!-- Swatches row 1 -->
  <!-- --bg #08090b -->
  <rect x="80" y="78" width="52" height="52" rx="2" fill="#08090b" stroke="rgba(214,219,222,0.12)" stroke-width="1" filter="url(#cardSh)"/>
  <text x="106" y="145" font-family="'Courier New', monospace" font-size="8" fill="#7f8589" text-anchor="middle">--bg</text>
  <text x="106" y="156" font-family="'Courier New', monospace" font-size="8" fill="#7f8589" text-anchor="middle">#08090b</text>

  <!-- --bg-2 #0d1013 -->
  <rect x="144" y="78" width="52" height="52" rx="2" fill="#0d1013" stroke="rgba(214,219,222,0.10)" stroke-width="1" filter="url(#cardSh)"/>
  <text x="170" y="145" font-family="'Courier New', monospace" font-size="8" fill="#7f8589" text-anchor="middle">--bg-2</text>
  <text x="170" y="156" font-family="'Courier New', monospace" font-size="8" fill="#7f8589" text-anchor="middle">#0d1013</text>

  <!-- --bg-3 #12161a -->
  <rect x="208" y="78" width="52" height="52" rx="2" fill="#12161a" stroke="rgba(214,219,222,0.10)" stroke-width="1" filter="url(#cardSh)"/>
  <text x="234" y="145" font-family="'Courier New', monospace" font-size="8" fill="#7f8589" text-anchor="middle">--bg-3</text>
  <text x="234" y="156" font-family="'Courier New', monospace" font-size="8" fill="#7f8589" text-anchor="middle">#12161a</text>

  <!-- --text #e6e3da -->
  <rect x="272" y="78" width="52" height="52" rx="2" fill="#e6e3da" stroke="rgba(214,219,222,0.08)" stroke-width="1" filter="url(#cardSh)"/>
  <text x="298" y="145" font-family="'Courier New', monospace" font-size="8" fill="#7f8589" text-anchor="middle">--text</text>
  <text x="298" y="156" font-family="'Courier New', monospace" font-size="8" fill="#7f8589" text-anchor="middle">#e6e3da</text>

  <!-- --text-2 #9aa3a8 -->
  <rect x="336" y="78" width="52" height="52" rx="2" fill="#9aa3a8" stroke="rgba(214,219,222,0.08)" stroke-width="1" filter="url(#cardSh)"/>
  <text x="362" y="145" font-family="'Courier New', monospace" font-size="8" fill="#7f8589" text-anchor="middle">--text-2</text>
  <text x="362" y="156" font-family="'Courier New', monospace" font-size="8" fill="#7f8589" text-anchor="middle">#9aa3a8</text>

  <!-- --text-3 #7f8589 -->
  <rect x="400" y="78" width="52" height="52" rx="2" fill="#7f8589" stroke="rgba(214,219,222,0.08)" stroke-width="1" filter="url(#cardSh)"/>
  <text x="426" y="145" font-family="'Courier New', monospace" font-size="8" fill="#7f8589" text-anchor="middle">--text-3</text>
  <text x="426" y="156" font-family="'Courier New', monospace" font-size="8" fill="#7f8589" text-anchor="middle">#7f8589</text>

  <!-- --accent #7c8891 -->
  <rect x="464" y="78" width="52" height="52" rx="2" fill="#7c8891" stroke="rgba(214,219,222,0.08)" stroke-width="1" filter="url(#cardSh)"/>
  <text x="490" y="145" font-family="'Courier New', monospace" font-size="8" fill="#7f8589" text-anchor="middle">--accent</text>
  <text x="490" y="156" font-family="'Courier New', monospace" font-size="8" fill="#7f8589" text-anchor="middle">#7c8891</text>

  <!-- --accent-bright #c9cfd2 -->
  <rect x="528" y="78" width="52" height="52" rx="2" fill="#c9cfd2" stroke="rgba(214,219,222,0.08)" stroke-width="1" filter="url(#cardSh)"/>
  <text x="554" y="145" font-family="'Courier New', monospace" font-size="8" fill="#7f8589" text-anchor="middle">--acc-bright</text>
  <text x="554" y="156" font-family="'Courier New', monospace" font-size="8" fill="#7f8589" text-anchor="middle">#c9cfd2</text>

  <!-- Board squares -->
  <rect x="592" y="78" width="52" height="52" rx="2" fill="#1a2027" stroke="rgba(214,219,222,0.08)" stroke-width="1" filter="url(#cardSh)"/>
  <text x="618" y="145" font-family="'Courier New', monospace" font-size="8" fill="#7f8589" text-anchor="middle">sq-light</text>
  <text x="618" y="156" font-family="'Courier New', monospace" font-size="8" fill="#7f8589" text-anchor="middle">#1a2027</text>

  <rect x="656" y="78" width="52" height="52" rx="2" fill="#0d1013" stroke="rgba(214,219,222,0.12)" stroke-width="1" filter="url(#cardSh)"/>
  <text x="682" y="145" font-family="'Courier New', monospace" font-size="8" fill="#7f8589" text-anchor="middle">sq-dark</text>
  <text x="682" y="156" font-family="'Courier New', monospace" font-size="8" fill="#7f8589" text-anchor="middle">#0d1013</text>

  <!-- ─── TYPOGRAPHY ─── -->
  <line x1="60" y1="175" x2="840" y2="175" stroke="rgba(214,219,222,0.06)" stroke-width="1"/>
  <text x="80" y="195" font-family="'Courier New', monospace" font-size="8" fill="#7f8589" letter-spacing="3">TYPOGRAPHY</text>

  <!-- Display font -->
  <text x="80" y="226" font-family="Georgia, serif" font-style="italic" font-weight="300" font-size="28"
        fill="#e6e3da">Cormorant Garamond</text>
  <text x="80" y="242" font-family="'Courier New', monospace" font-size="8" fill="#7f8589" letter-spacing="1">--font-display · headings · brand name · italic 300</text>

  <!-- Body font -->
  <text x="80" y="272" font-family="system-ui, sans-serif" font-weight="300" font-size="18"
        fill="#c9cfd2">Jost — Interface &amp; Body</text>
  <text x="80" y="287" font-family="'Courier New', monospace" font-size="8" fill="#7f8589" letter-spacing="1">--font-body · weight 300 / 400 / 500 · all UI text</text>

  <!-- Mono font -->
  <text x="80" y="315" font-family="'Courier New', monospace" font-size="14" fill="#9aa3a8" letter-spacing="1">JetBrains Mono · 0.58rem labels</text>
  <text x="80" y="330" font-family="'Courier New', monospace" font-size="8" fill="#7f8589" letter-spacing="1">--font-mono · eyebrows · kickers · uppercase · letter-spacing: 0.3em</text>

  <!-- ─── SPACING / RADIUS ─── -->
  <line x1="580" y1="175" x2="580" y2="360" stroke="rgba(214,219,222,0.05)" stroke-width="1"/>
  <text x="600" y="195" font-family="'Courier New', monospace" font-size="8" fill="#7f8589" letter-spacing="3">RADIUS &amp; EASING</text>

  <!-- radius-card = 2px -->
  <rect x="600" y="205" width="48" height="48" rx="2" fill="#12161a" stroke="rgba(201,207,210,0.12)" stroke-width="1"/>
  <text x="624" y="267" font-family="'Courier New', monospace" font-size="8" fill="#7f8589" text-anchor="middle">--radius-card</text>
  <text x="624" y="278" font-family="'Courier New', monospace" font-size="8" fill="#9aa3a8" text-anchor="middle">2px</text>

  <!-- radius-img = 2px -->
  <rect x="660" y="205" width="48" height="48" rx="2" fill="#12161a" stroke="rgba(201,207,210,0.12)" stroke-width="1"/>
  <text x="684" y="267" font-family="'Courier New', monospace" font-size="8" fill="#7f8589" text-anchor="middle">--radius-img</text>
  <text x="684" y="278" font-family="'Courier New', monospace" font-size="8" fill="#9aa3a8" text-anchor="middle">2px</text>

  <!-- easing -->
  <text x="600" y="308" font-family="'Courier New', monospace" font-size="9" fill="#9aa3a8">--ease-liturgy</text>
  <text x="600" y="322" font-family="'Courier New', monospace" font-size="8" fill="#7f8589">cubic-bezier(0.16, 0.4, 0.15, 1)</text>
  <text x="600" y="340" font-family="'Courier New', monospace" font-size="9" fill="#9aa3a8">--ease-out</text>
  <text x="600" y="354" font-family="'Courier New', monospace" font-size="8" fill="#7f8589">cubic-bezier(0, 0, 0.2, 1)</text>

  <!-- Border -->
  <rect x="0.5" y="0.5" width="899" height="359" rx="2" fill="none"
        stroke="rgba(214,219,222,0.07)" stroke-width="1"/>
</svg>
